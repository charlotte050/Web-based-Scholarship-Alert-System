<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reset your Password</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(180deg, #0447B2 0%, #8CC9EA 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background-color: #ffffff;
            width: 100%;
            max-width: 480px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
            padding: 32px;
            position: relative;
            overflow: hidden;
        }

        .reset-card {
            width: min(100%, 390px);
            min-height: 420px;
            margin: 0 auto;
        }

        .card-title {
            font-family: 'Montserrat', 'Segoe UI', sans-serif;
            font-size: 27px;
            font-weight: 800;
            color: #1D49A8;
            margin-top: 38px;
            margin-bottom: 13px;
            line-height: 1.1;
            letter-spacing: 0.2px;
            font-style: normal;
            text-align: left;
        }

        .card-desc {
            font-family: 'Inter', 'Segoe UI', sans-serif;
            font-size: 16px;
            color: #636A79;
            font-weight: 600;
            margin-bottom: 18px;
            line-height: 1.45;
            text-align: left;
        }

        .form-group {
            margin-bottom: 15px;
            position: relative;
        }

        label {
            display: block;
            font-size: 13px;
            color: #072463;
            font-weight: 600;
            margin-bottom: 5px;
        }

        input[type="password"],
        input[type="text"] {
            width: 390px;
            height: 41px;
            padding: 10px 12px;
            border: 2px solid #1D49A8;
            border-radius: 6px;
            font-size: 13px;
            color: #000000;
            outline: none;
            transition: border-color 0.2s;
            background-color: #ffffff;
        }

        input.error-input {
            border-color: #ef4444 !important;
        }

        input::placeholder {
            color: #747474;
        }

        input:focus {
            border-color: #1D49A8;
            box-shadow: 0 0 0 2px rgba(29, 73, 168, 0.12);
        }

        .password-container {
            position: relative;
        }

        .password-container i {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: #64748b;
            cursor: pointer;
            font-size: 14px;
        }

        .error-message {
            font-size: 11px;
            color: #ef4444;
            display: none;
        }

        .btn-secondary {
            width: 100%;
            background-color: #1D49A8;
            color: #ffffff;
            border: none;
            padding: 12px;
            border-radius: 24px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 10px;
            transition: background-color 0.2s;
        }

        .btn-secondary:hover {
            background-color: #163a85;
        }

        .modal-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(7, 24, 54, 0.12);
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            display: none;
            justify-content: center;
            align-items: center;
            border-radius: 20px;
            z-index: 10;
        }

        .modal-box {
            width: 100%;
            max-width: 380px;
            background-color: #ffffff;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.25);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .modal-header-bg {
            height: 120px;
            background: linear-gradient(180deg, #083AA7 0%, #4580FF 100%);
            position: relative;
            display: flex;
            justify-content: center;
        }

        .check-circle {
            width: 56px;
            height: 56px;
            background: linear-gradient(180deg, #083AA7 0%, #4580FF 100%);
            border: 4px solid #ffffff;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #ffffff;
            font-size: 22px;
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.15);
            position: absolute;
            bottom: -28px;
        }

        .modal-content-card {
            background-color: #ffffff;
            padding: 40px 26px 30px 26px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .modal-title {
            font-family: 'Montserrat', 'Segoe UI', sans-serif;
            font-size: 20px;
            font-weight: 800;
            color: #111827;
            margin-bottom: 10px;
            letter-spacing: -0.2px;
        }

        .modal-text {
            font-size: 13px;
            color: #5A6D96;
            line-height: 1.5;
            margin-bottom: 22px;
            max-width: 320px;
            font-weight: 500;
        }

        .btn-modal-return {
            width: 100%;
            background: linear-gradient(180deg, #083AA7 0%, #4580FF 100%);
            color: #ffffff;
            border: none;
            padding: 14px;
            border-radius: 30px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 6px 16px rgba(69, 128, 255, 0.35);
            transition: opacity 0.2s;
        }

        .btn-modal-return:hover {
            opacity: 0.92;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="reset-card">
            <div class="card-title" style="margin-top: 48px;">Reset your Password</div>
            <div class="card-desc" style="margin-top: 4px;">Set your new password</div>

            <form id="resetForm" onsubmit="handleResetSubmit(event)" novalidate style="margin-top: 26px; display: flex; flex-direction: column; gap: 26px; margin-bottom: 18px;">
                <div class="form-group" style="margin-top: 8px; margin-bottom: 0;">
                    <label>New Password</label>
                    <div class="password-container">
                        <input type="password" id="newPassword" placeholder="••••••••" oninput="clearFieldError(this, document.getElementById('newPasswordError'))" />
                        <i class="fa-regular fa-eye" onclick="togglePassword('newPassword')"></i>
                    </div>
                    <div id="newPasswordError" class="error-message" style="margin-top: 4px;"></div>
                </div>

                <div class="form-group" style="margin-top: 0; margin-bottom: 0;">
                    <label>Confirm New Password</label>
                    <div class="password-container">
                        <input type="password" id="confirmNewPassword" placeholder="••••••••" oninput="clearFieldError(this, document.getElementById('confirmNewPasswordError'))" />
                        <i class="fa-regular fa-eye" onclick="togglePassword('confirmNewPassword')"></i>
                    </div>
                    <div id="confirmNewPasswordError" class="error-message" style="margin-top: 4px;"></div>
                </div>

                <button type="submit" class="btn-secondary" style="margin-top: 0;">Update Password</button>
            </form>
        </div>

        <div id="successModal" class="modal-overlay">
            <div class="modal-box">
                <div class="modal-header-bg">
                    <div class="check-circle">
                        <i class="fa-solid fa-check"></i>
                    </div>
                </div>
                <div class="modal-content-card">
                    <div class="modal-title">Password Reset Successfully</div>
                    <div class="modal-text">Your password has been changed successfully.</div>
                    <button class="btn-modal-return" onclick="closeModalAndLogin()">Return to Log in</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        function togglePassword(fieldId) {
            const field = document.getElementById(fieldId);
            if (!field) return;

            const container = field.closest('.password-container');
            const icon = container ? container.querySelector('i') : null;
            if (!icon) return;

            const currentValue = field.value;
            const currentSelectionStart = field.selectionStart;
            const currentSelectionEnd = field.selectionEnd;
            const isPassword = field.type === 'password';

            field.type = isPassword ? 'text' : 'password';
            field.value = currentValue;
            field.setSelectionRange(currentSelectionStart, currentSelectionEnd);

            icon.classList.toggle('fa-eye', !isPassword);
            icon.classList.toggle('fa-eye-slash', isPassword);
        }

        function clearFieldError(inputElem, errorElem) {
            if (inputElem) inputElem.classList.remove('error-input');
            if (errorElem) {
                errorElem.textContent = '';
                errorElem.style.display = 'none';
            }
        }

        function showFieldError(inputElem, errorElem, message) {
            if (inputElem) inputElem.classList.add('error-input');
            if (errorElem) {
                errorElem.textContent = message;
                errorElem.style.display = 'block';
            }
        }

        function handleResetSubmit(event) {
            event.preventDefault();
            let isValid = true;

            const newPassword = document.getElementById('newPassword');
            const newPasswordError = document.getElementById('newPasswordError');

            const confirmNewPassword = document.getElementById('confirmNewPassword');
            const confirmNewPasswordError = document.getElementById('confirmNewPasswordError');

            clearFieldError(newPassword, newPasswordError);
            clearFieldError(confirmNewPassword, confirmNewPasswordError);

            if (!newPassword.value) {
                showFieldError(newPassword, newPasswordError, "Enter your password");
                isValid = false;
            } else if (newPassword.value.length < 8) {
                showFieldError(newPassword, newPasswordError, "Password must be at least 8 characters");
                isValid = false;
            }

            if (confirmNewPassword.value !== newPassword.value) {
                showFieldError(confirmNewPassword, confirmNewPasswordError, "Does not match your input password");
                isValid = false;
            }

            if (isValid) {
                document.getElementById('successModal').style.display = 'flex';
            }
        }

        function closeModalAndLogin() {
            document.getElementById('successModal').style.display = 'none';
            window.location.href = 'login.html';
        }
    </script>
</body>
</html>
